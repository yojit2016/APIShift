openapi: 3.0.3
info:
  title: APIShift Order Service API
  version: 1.0.0
  description: E-Commerce API Contract (Before breaking change)
paths:
  /api/orders/{id}:
    get:
      summary: Retrieve order details by ID
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - total
                  - status
                properties:
                  id:
                    type: string
                  total:
                    type: number
                  status:
                    type: string
  /api/orders:
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - items
              properties:
                customer_id:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                coupon_code:
                  type: string
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  total:
                    type: number
                  status:
                    type: string
